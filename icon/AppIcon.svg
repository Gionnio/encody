<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2A8F"/>
      <stop offset="0.55" stop-color="#5B2BB5"/>
      <stop offset="1" stop-color="#1B1147"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB020"/>
      <stop offset="0.35" stop-color="#FF4F8B"/>
      <stop offset="0.7" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="screenShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <!-- ombre con filtri SVG 1.1: feDropShadow non è supportato da Inkscape -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="0" dy="14" result="blur"/>
      <feFlood flood-color="#000" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="blur"/>
      <feFlood flood-color="#000" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <!-- corpo icona (griglia macOS: 824 px su 1024) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- onde di luce sullo sfondo -->
    <path d="M100 700 C 330 600, 560 820, 924 640 L 924 924 L 100 924 Z" fill="#000" opacity="0.18"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" ry="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>

  <!-- pellicola -->
  <g filter="url(#soft)">
    <rect x="210" y="290" width="604" height="444" rx="58" fill="#0E0A22"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.32">
    <rect x="252" y="312" width="44" height="30" rx="8"/><rect x="330" y="312" width="44" height="30" rx="8"/>
    <rect x="408" y="312" width="44" height="30" rx="8"/><rect x="486" y="312" width="44" height="30" rx="8"/>
    <rect x="564" y="312" width="44" height="30" rx="8"/><rect x="642" y="312" width="44" height="30" rx="8"/>
    <rect x="720" y="312" width="44" height="30" rx="8"/>
    <rect x="252" y="682" width="44" height="30" rx="8"/><rect x="330" y="682" width="44" height="30" rx="8"/>
    <rect x="408" y="682" width="44" height="30" rx="8"/><rect x="486" y="682" width="44" height="30" rx="8"/>
    <rect x="564" y="682" width="44" height="30" rx="8"/><rect x="642" y="682" width="44" height="30" rx="8"/>
    <rect x="720" y="682" width="44" height="30" rx="8"/>
  </g>

  <!-- fotogramma HDR -->
  <rect x="246" y="366" width="532" height="292" rx="26" fill="url(#hdr)"/>
  <rect x="246" y="366" width="532" height="292" rx="26" fill="url(#screenShade)"/>

  <!-- play -->
  <g filter="url(#soft)">
    <path d="M462 436 L 462 588 Q 462 606 478 597 L 598 527 Q 613 512 598 497 L 478 427 Q 462 418 462 436 Z" fill="#FFFFFF"/>
  </g>

</svg>
